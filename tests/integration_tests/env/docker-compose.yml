services:
  mqtt_broker:
    build:
      dockerfile: mqtt_broker.dockerfile
      context: .
    network_mode: host
  test:
    depends_on: [ mqtt_broker, toxiproxy ]
    build:
      context: .
      dockerfile: test.dockerfile
    command: >
        bash -c "chmod +x /home/bin/hacpp-integration-tests &&
        /home/bin/hacpp-integration-tests ${CMD_OPTIONS}
        "
    volumes:
      - ${ARTIFACTS_DIR}:/home/bin
      - .:/home/env
    network_mode: host

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:latest
    network_mode: host
    command: -host 0.0.0.0

  mqtt_explorer:
    depends_on: [ mqtt_broker ]
    image: ghcr.io/thomasnordquist/mqtt-explorer:latest
    environment:
      - MQTT_HOST=localhost
      - MQTT_PORT=1883
      - MQTT_EXPLORER_USERNAME=${MQTT_EXPLORER_USERNAME}
      - MQTT_EXPLORER_PASSWORD=${MQTT_EXPLORER_PASSWORD}
    volumes:
      - mqtt_explorer_data:/app/data
    ports:
      - "4000:4000"
    network_mode: host

volumes:
  mqtt_explorer_data:
