name: Quality

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  clang-format:
    name: Clang Format
    runs-on: ubuntu-latest
    container:
      image: bicompb/cpp-clang-19
      options: --user root
    steps:
      - uses: actions/checkout@v6

      - name: Run clang-format
        run: bash tools/check-clang-format.sh

      - name: Verify clang-format
        run: bash tools/verify-clang-format.sh

  clang-tidy:
    name: Clang Tidy
    runs-on: ubuntu-latest
    container:
      image: bicompb/cpp-clang-19
      options: --user root
    steps:
      - uses: actions/checkout@v6

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-clang-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-clang-

      - name: Add conan remote
        run: conan remote add mygitlab https://gitlab.com/api/v4/projects/75478887/packages/conan || true

      - name: Configure CMake for clang-tidy
        run: cmake --preset linux-native-conan-clang-debug

      - name: Run clang-tidy
        working-directory: build
        shell: bash
        run: bash ../tools/check-clang-tidy.sh

      - name: Verify clang-tidy
        working-directory: build
        shell: bash
        run: bash ../tools/verify-clang-tidy.sh
